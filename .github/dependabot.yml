version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "23 5 7 * *"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      development-tools:
        dependency-type: development
        update-types:
          - minor
          - patch
      runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "47 6 11 * *"
    open-pull-requests-limit: 15
